name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install
      - name: Prepare web files
        run: npm run www
      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1F5F8B' --splashBackgroundColor '#1F5F8B' || echo "icon generation skipped"
          npx cap sync android
          python3 native/patch_android.py
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DraftLy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DraftLy-apk
          path: DraftLy.apk
      - name: Publish download link (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" DraftLy.apk --repo "$GITHUB_REPOSITORY" --title "DraftLy for Android (build ${GITHUB_RUN_NUMBER})" --notes "Install on your phone: open https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/DraftLy.apk" --latest
